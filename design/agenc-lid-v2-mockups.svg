<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101116"/>
      <stop offset="0.62" stop-color="#151725"/>
      <stop offset="1" stop-color="#241A2F"/>
    </linearGradient>
    <linearGradient id="onPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101116"/>
      <stop offset="0.58" stop-color="#10241B"/>
      <stop offset="1" stop-color="#153B2A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .bg { fill: #090B10; }
      .panel { stroke: rgba(248,247,255,0.14); stroke-width: 1.2; filter: url(#shadow); }
      .title { font: 700 24px "Space Grotesk", "Inter", system-ui, sans-serif; fill: #F8F7FF; }
      .label { font: 700 11px "Geist Mono", "IBM Plex Mono", monospace; letter-spacing: 1.5px; fill: rgba(248,247,255,0.46); }
      .mono { font: 600 13px "Geist Mono", "IBM Plex Mono", monospace; fill: rgba(248,247,255,0.74); }
      .small { font: 600 11px "Geist Mono", "IBM Plex Mono", monospace; fill: rgba(248,247,255,0.50); }
      .h1 { font: 700 33px "Space Grotesk", "Inter", system-ui, sans-serif; fill: #F8F7FF; }
      .h2 { font: 700 22px "Space Grotesk", "Inter", system-ui, sans-serif; fill: #F8F7FF; }
      .orange { fill: #F97316; }
      .green { fill: #76E4A6; }
      .muted { fill: rgba(248,247,255,0.62); }
      .buttonText { font: 800 13px "Geist Mono", "IBM Plex Mono", monospace; letter-spacing: 1px; fill: #F8F7FF; }
      .ghostText { font: 700 12px "Geist Mono", "IBM Plex Mono", monospace; letter-spacing: 1px; fill: rgba(248,247,255,0.62); }
    </style>
  </defs>

  <rect class="bg" width="1320" height="620"/>
  <text x="48" y="58" class="title">agenc-lid menu v2</text>
  <text x="48" y="84" class="label">NO LOGO INSIDE MENU / STATUS BAR ICON IS THE BRAND MARK</text>

  <g transform="translate(56 122)">
    <circle cx="0" cy="-36" r="10" fill="#F8F7FF"/>
    <text x="18" y="-31" class="small">OFF icon: white</text>
    <circle cx="148" cy="-36" r="10" fill="#76E4A6"/>
    <text x="166" y="-31" class="small">ON icon: green</text>
  </g>

  <!-- OFF VIEW -->
  <g transform="translate(56 146)">
    <rect width="360" height="408" rx="26" fill="url(#panel)" class="panel"/>
    <text x="24" y="44" class="title">agenc-lid</text>
    <rect x="278" y="22" width="58" height="28" rx="14" fill="rgba(248,247,255,0.07)" stroke="rgba(248,247,255,0.16)"/>
    <text x="295" y="41" class="ghostText">OFF</text>

    <text x="24" y="104" class="label">STATUS</text>
    <text x="24" y="142" class="h1">Normal sleep</text>
    <text x="24" y="170" class="mono">Closing the lid sleeps this Mac.</text>
    <text x="24" y="196" class="small">Battery 62%</text>

    <text x="24" y="250" class="label orange">KEEP AWAKE</text>
    <rect x="24" y="270" width="148" height="52" rx="14" fill="rgba(249,115,22,0.18)" stroke="#F97316"/>
    <text x="70" y="302" class="buttonText">1 HOUR</text>
    <rect x="188" y="270" width="148" height="52" rx="14" fill="rgba(249,115,22,0.18)" stroke="#F97316"/>
    <text x="234" y="302" class="buttonText">4 HOURS</text>
    <rect x="24" y="334" width="312" height="52" rx="14" fill="rgba(137,86,194,0.18)" stroke="#8956C2"/>
    <text x="121" y="366" class="buttonText">UNTIL RESET</text>

    <line x1="24" y1="408" x2="336" y2="408" stroke="rgba(248,247,255,0.10)"/>
    <text x="24" y="440" class="ghostText">DETAILS</text>
    <text x="273" y="440" class="ghostText">QUIT</text>
  </g>

  <!-- ON VIEW -->
  <g transform="translate(480 146)">
    <rect width="360" height="408" rx="26" fill="url(#onPanel)" class="panel"/>
    <text x="24" y="44" class="title">agenc-lid</text>
    <rect x="286" y="22" width="50" height="28" rx="14" fill="rgba(118,228,166,0.15)" stroke="#76E4A6"/>
    <text x="300" y="41" class="ghostText" fill="#76E4A6">ON</text>

    <text x="24" y="104" class="label">STATUS</text>
    <text x="24" y="142" class="h1">Lid awake</text>
    <text x="24" y="170" class="mono">Agents keep running when lid closes.</text>
    <text x="24" y="196" class="small">Battery 62% / keep ventilated</text>

    <rect x="24" y="232" width="312" height="68" rx="18" fill="rgba(118,228,166,0.10)" stroke="rgba(118,228,166,0.40)"/>
    <text x="44" y="260" class="label green">ACTIVE SESSION</text>
    <text x="44" y="284" class="h2">4 hours armed</text>

    <rect x="24" y="326" width="312" height="56" rx="15" fill="rgba(255,106,47,0.18)" stroke="#FF6A2F"/>
    <text x="123" y="361" class="buttonText">TURN OFF</text>

    <line x1="24" y1="408" x2="336" y2="408" stroke="rgba(248,247,255,0.10)"/>
    <text x="24" y="440" class="ghostText">DETAILS</text>
    <text x="273" y="440" class="ghostText">QUIT</text>
  </g>

  <!-- DETAILS VIEW -->
  <g transform="translate(904 146)">
    <rect width="360" height="408" rx="26" fill="url(#panel)" class="panel"/>
    <text x="24" y="44" class="title">Details</text>
    <text x="263" y="42" class="ghostText">DONE</text>

    <text x="24" y="102" class="label orange">POWER</text>
    <rect x="24" y="122" width="312" height="52" rx="14" fill="rgba(248,247,255,0.045)" stroke="rgba(248,247,255,0.12)"/>
    <text x="44" y="154" class="mono">Battery</text>
    <text x="270" y="154" class="mono">62%</text>

    <text x="24" y="220" class="label orange">PMSET</text>
    <text x="24" y="256" class="mono">Lid sleep override</text>
    <text x="260" y="256" class="mono">OFF</text>
    <text x="24" y="292" class="mono">System sleep timer</text>
    <text x="268" y="292" class="mono">1m</text>
    <text x="24" y="328" class="mono">Display sleep</text>
    <text x="268" y="328" class="mono">2m</text>

    <rect x="24" y="356" width="312" height="52" rx="14" fill="rgba(248,247,255,0.045)" stroke="rgba(248,247,255,0.12)"/>
    <text x="92" y="388" class="ghostText">COPY RAW PMSET</text>
  </g>
</svg>
